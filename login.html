<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gamify Edu</title>
  <link rel="stylesheet" href="css/style.css?v=7">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  
  <!-- Botão do Tema flutuante -->
  <button class="theme-toggle" onclick="toggleTheme()" style="position:absolute; top:20px; right:20px; z-index:100;">
    <span class="theme-icon">🌙</span>
  </button>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="logo">Gamify<span>Edu</span></div>
      <h2>Bem-vindo de volta!</h2>
      <p>Entre para continuar sua jornada de aprendizado.</p>
    </div>

    <div class="auth-box">
      <div class="tabs">
        <button class="tab active" data-tab="login">Entrar</button>
        <button class="tab" data-tab="signup">Cadastrar</button>
      </div>

      <form id="login-form" class="auth-form active">
        <h2>Entrar</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <div class="form-error" id="login-error"></div>
      </form>

      <form id="signup-form" class="auth-form">
        <h2>Criar Conta</h2>
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="signup-name" placeholder="João Silva" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha (mín. 6 caracteres)</label>
          <input type="password" id="signup-password" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="form-group">
          <label>Eu sou:</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="student" checked>
              <span>Aluno</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="teacher">
              <span>Professor</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar Conta</button>
        <div class="form-error" id="signup-error"></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
